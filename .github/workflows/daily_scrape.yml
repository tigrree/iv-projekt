name: Daily IV Scraper

on:
  schedule:
    # Erläuterung der Zeiten:
    # 10:23 UTC -> 12:23 Schweizer Sommerzeit
    # 11:23 UTC -> 12:23 Schweizer Winterzeit
    # 13:23 UTC -> 15:23 Schweizer Sommerzeit
    # 14:23 UTC -> 15:23 Schweizer Winterzeit
    - cron: '23 10,11,13,14 * * 1-5'
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit die Action Dateien zurückschreiben darf

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3
        with:
          persist-credentials: true # Stellt sicher, dass das Push-Recht erhalten bleibt

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Dependencies
        run: |
          pip install requests beautifulsoup4 anthropic 
          # Hier wurde 'anthropic' hinzugefügt

      - name: Run Scraper Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} 
          # Hier wurde die Umgebungsvariable für Claude hinzugefügt
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f urteile.json ]; then
            git add urteile.json
            # Commit nur, wenn tatsächlich Änderungen (neue Urteile) vorhanden sind
            git commit -m "Automatisches Update: $(date +'%d.%m.%Y %H:%M')" || exit 0
            git push
          else
            echo "Datei urteile.json wurde nicht gefunden. Überspringe Commit."
          fi
