<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IV-Entscheide BGer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .is-open > .accordion-content { max-height: 10000px; transition: max-height 0.5s ease-in; }
        .rotate-icon { transition: transform 0.3s; }
        .is-open > button .rotate-icon { transform: rotate(180deg); }
        .dropdown-menu { display: none; }
        .dropdown-menu.show { display: block; }
        .summary-title { font-weight: 700; display: block; margin-top: 1.25rem; margin-bottom: 0px !important; color: currentColor; text-align: left; line-height: 1.5; }
        .summary-title:first-child { margin-top: 0 !important; }
        .summary-text-block { display: block; margin-top: 0px !important; padding-top: 2px; margin-bottom: 0.5rem !important; text-align: left; }
        .ios-button { display: block !important; width: 100% !important; box-sizing: border-box; background-color: #3b82f6; color: white !important; padding: 8px 0 !important; border-radius: 8px; font-weight: 600; font-size: 14px; text-align: center !important; text-decoration: none !important; margin-top: 1.25rem !important; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent; }
        .ios-button:active { transform: scale(0.99); }
    </style>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white font-sans antialiased text-left">
    <div class="max-w-4xl mx-auto min-h-screen px-4 sm:px-6 lg:px-8 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-gray-100 dark:border-gray-800 pb-4">
            <button onclick="toggleThemeMenu(event)" id="theme-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span id="active-theme-icon"></span>
            </button>
            <button onclick="location.reload()" class="text-gray-400 p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </header>

        <h1 class="text-3xl sm:text-4xl font-bold mb-8 tracking-tight">IV-Entscheide BGer</h1>
        <div id="loading" class="text-gray-500 text-center py-10 italic">Lade Entscheide...</div>
        <div id="app-container" class="space-y-6"></div>
    </div>

    <script>
        // Icons und Theme-Logik identisch zu vorher... (hier weggelassen für Fokus auf Änderung)

        function formatSummary(text) {
            if (!text) return '';
            text = text.trim().replace("Zu prüfen & Entscheidung", "Entscheidung");
            let html = '<span class="summary-text-block text-left">' + text + '</span>';
            html = html.replace(/\*\*(.*?)\*\*\n?/g, '</span><span class="summary-title text-left">$1</span><span class="summary-text-block text-left">');
            html = html.replace(/\n\n/g, '</span><span class="summary-text-block text-left">');
            return html.replace(/<span[^>]*>\s*<\/span>/g, '');
        }

        async function loadUrteile() {
            try {
                const response = await fetch('urteile.json?v=' + Date.now());
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('app-container');
                
                const tageMap = {};
                data.forEach(u => { if (!tageMap[u.datum]) tageMap[u.datum] = []; tageMap[u.datum].push(u); });
                const sortierteTage = Object.keys(tageMap).sort((a, b) => b.split('.').reverse().join('') - a.split('.').reverse().join(''));

                sortierteTage.forEach((datum, i) => {
                    const urteileAmTag = tageMap[datum];
                    const echteUrteile = urteileAmTag.filter(u => u.aktenzeichen !== "INFO_SKIP");
                    const daySection = document.createElement('div');
                    daySection.className = i === 0 ? "accordion-group is-open" : "accordion-group";
                    
                    let dayHtml = `<button onclick="this.parentElement.classList.toggle('is-open')" class="w-full flex justify-between items-center px-1 mb-2"><span class="text-xl font-bold">${datum}</span><svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round"/></svg></button><div class="accordion-content space-y-3">`;

                    if (echteUrteile.length > 0) {
                        dayHtml += `<div class="bg-gray-100 dark:bg-[#1c1c1e] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm mb-4">`;
                        echteUrteile.forEach(u => {
                            // LOGIK FÜR ROTEN PUBLIKATIONSHINWEIS
                            const pubHinweis = u.publikation ? `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Achtung: Zur Publikation vorgesehen!</div>` : '';
                            
                            dayHtml += `
                                <div class="sub-accordion-item">
                                    <button onclick="this.parentElement.classList.toggle('is-open')" class="w-full text-left px-6 py-5 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors flex justify-between items-center group">
                                        <div class="text-left pr-4">
                                            <div class="text-blue-600 dark:text-blue-500 font-bold text-xl">${u.aktenzeichen}</div>
                                            ${pubHinweis}
                                            <div class="text-gray-500 dark:text-gray-400 text-sm mt-0.5">${u.vorschau}</div>
                                        </div>
                                        <svg class="rotate-icon flex-shrink-0 w-6 h-6 text-gray-400 group-hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                    <div class="accordion-content bg-white/40 dark:bg-black/20">
                                        <div class="px-6 pt-3 pb-6 text-gray-800 dark:text-gray-300 whitespace-pre-wrap border-t border-gray-200 dark:border-gray-800/30">
                                            ${formatSummary(u.zusammenfassung)}<a href="${u.url}" target="_blank" class="ios-button">Originalurteil öffnen</a>
                                        </div>
                                    </div>
                                </div>`;
                        });
                        dayHtml += `</div>`;
                    } else {
                        dayHtml += `<div class="bg-gray-100 dark:bg-[#1c1c1e] p-6 rounded-2xl text-left font-bold text-lg text-gray-700 dark:text-gray-200">Keine IV-relevanten Publikationen</div>`;
                    }
                    dayHtml += `</div>`;
                    daySection.innerHTML = dayHtml;
                    container.appendChild(daySection);
                });
            } catch (e) { document.getElementById('loading').innerHTML = "Fehler beim Laden."; }
        }
        loadUrteile();
    </script>
</body>
</html>
