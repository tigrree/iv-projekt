<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGer-Entscheide (IV & AK)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .is-open > .accordion-content { max-height: 10000px; transition: max-height 0.5s ease-in; }
        .rotate-icon { transition: transform 0.3s; }
        .is-open > button .rotate-icon { transform: rotate(180deg); }
        .dropdown-menu { display: none; }
        .dropdown-menu.show { display: block; }
        .summary-title { font-weight: 700; display: block; margin-top: 1.25rem; color: currentColor; text-align: left; }
        .summary-text-block { display: block; padding-top: 2px; margin-bottom: 0.5rem; text-align: left; }
        .ios-button { display: block; width: 100%; background-color: #3b82f6; color: white !important; padding: 10px 0; border-radius: 10px; font-weight: 600; text-align: center; text-decoration: none; margin-top: 1.5rem; transition: opacity 0.2s; }
        .filter-btn { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; transition: all 0.2s; border: 1px solid #e5e7eb; }
        .dark .filter-btn { border-color: #374151; }
        .filter-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white font-sans antialiased text-left">
    <div class="max-w-4xl mx-auto min-h-screen px-4 py-8">
        <header class="flex justify-between items-center mb-6 border-b border-gray-100 dark:border-gray-800 pb-4">
            <button onclick="toggleThemeMenu(event)" id="theme-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span id="active-theme-icon" class="font-bold"></span>
            </button>
            <div id="theme-menu" class="dropdown-menu absolute left-4 mt-2 w-48 bg-white dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl z-50 overflow-hidden">
                <button onclick="setTheme('system')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">System</button>
                <button onclick="setTheme('light')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">Hell</button>
                <button onclick="setTheme('dark')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">Dunkel</button>
            </div>

            <div class="flex gap-2">
                <button onclick="setFilter('iv')" id="filter-iv" class="filter-btn">IV</button>
                <button onclick="setFilter('ak')" id="filter-ak" class="filter-btn">AK</button>
                <button onclick="setFilter('alle')" id="filter-alle" class="filter-btn active">Alle</button>
            </div>

            <button onclick="location.reload()" class="text-gray-400 p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </header>

        <h1 id="page-title" class="text-3xl font-bold mb-8 text-left">IV- und AK-relevante Urteile</h1>
        <div id="loading" class="text-gray-500 text-center py-10 italic">Lade Entscheide...</div>
        <div id="app-container" class="space-y-6"></div>
    </div>

    <script>
        let allData = [], currentFilter = 'alle';

        function setTheme(theme) { localStorage.theme = theme; location.reload(); }
        function toggleThemeMenu(e) { e.stopPropagation(); document.getElementById('theme-menu').classList.toggle('show'); }
        document.documentElement.classList.toggle('dark', localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches));

        function setFilter(mode) {
            currentFilter = mode;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('filter-' + mode).classList.add('active');
            document.getElementById('page-title').innerText = mode === 'iv' ? "IV-relevante Urteile" : mode === 'ak' ? "AK-relevante Urteile" : "IV- und AK-relevante Urteile";
            renderUrteile();
        }

        function formatSummary(text) {
            if (!text) return '';
            let html = '<span class="summary-text-block">' + text.trim() + '</span>';
            html = html.replace(/\*\*(.*?)\*\*\n?/g, '</span><span class="summary-title">$1</span><span class="summary-text-block">');
            return html.replace(/\n\n/g, '</span><span class="summary-text-block">');
        }

        async function loadUrteile() {
            try {
                const response = await fetch('urteile.json?v=' + Date.now());
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderUrteile();
            } catch (e) { document.getElementById('loading').innerHTML = "Fehler beim Laden."; }
        }

        function renderUrteile() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            let filtered = allData.filter(u => currentFilter === 'alle' || u.kategorie === 'beide' || u.kategorie === currentFilter);
            const tageMap = {};
            filtered.forEach(u => { if (!tageMap[u.datum]) tageMap[u.datum] = []; tageMap[u.datum].push(u); });
            Object.keys(tageMap).sort((a, b) => b.split('.').reverse().join('') - a.split('.').reverse().join('')).forEach((datum, i) => {
                const echteUrteile = tageMap[datum].filter(u => u.aktenzeichen !== "INFO_SKIP");
                const daySection = document.createElement('div');
                daySection.className = i === 0 ? "accordion-group is-open" : "accordion-group";
                let dayHtml = `<button onclick="this.parentElement.classList.toggle('is-open')" class="w-full flex justify-between items-center mb-2"><span class="text-xl font-bold">${datum}</span><svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="accordion-content space-y-3">`;
                if (echteUrteile.length > 0) {
                    dayHtml += `<div class="bg-gray-100 dark:bg-[#1c1c1e] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm">`;
                    echteUrteile.forEach(u => {
                        const tag = u.kategorie === 'ak' ? 'AK' : u.kategorie === 'iv' ? 'IV' : 'IV/AK';
                        dayHtml += `<div class="sub-accordion-item"><button onclick="this.parentElement.classList.toggle('is-open')" class="w-full text-left px-6 py-5 hover:bg-gray-200 dark:hover:bg-gray-700 flex justify-between items-center group"><div class="pr-4"><div class="flex items-center"><span class="text-blue-600 dark:text-blue-500 font-bold text-xl">${u.aktenzeichen}</span><span class="ml-2 px-2 py-0.5 bg-gray-200 dark:bg-gray-800 text-[10px] rounded font-bold">${tag}</span></div><div class="text-gray-500 text-sm mt-0.5">${u.vorschau}</div></div><svg class="rotate-icon w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="accordion-content bg-white/40 dark:bg-black/20"><div class="px-6 pt-3 pb-6 text-base border-t border-gray-200 dark:border-gray-800/30 text-left">${formatSummary(u.zusammenfassung)}<a href="${u.url}" target="_blank" class="ios-button">Originalurteil öffnen</a></div></div></div>`;
                    });
                    dayHtml += `</div>`;
                } else { dayHtml += `<div class="bg-gray-100 dark:bg-[#1c1c1e] p-6 rounded-2xl text-gray-500 italic mb-4">Keine Treffer für diesen Filter</div>`; }
                daySection.innerHTML = dayHtml + `</div>`;
                container.appendChild(daySection);
            });
        }
        loadUrteile();
    </script>
</body>
</html>
