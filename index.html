<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGer-Entscheide (IV & AK)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .is-open > .accordion-content { max-height: 10000px; transition: max-height 0.5s ease-in; }
        .rotate-icon { transition: transform 0.3s; }
        .is-open > button .rotate-icon { transform: rotate(180deg); }
        .dropdown-menu { display: none; position: absolute; top: 100%; z-index: 50; }
        .dropdown-menu.show { display: block; }
        
        /* Titel-Styling */
        .summary-title { font-weight: 700; display: block; margin-top: 1.5rem; margin-bottom: 0.25rem; color: currentColor; text-align: left; font-size: 1.1rem; }
        .summary-text-block { display: block; margin-bottom: 0.75rem; text-align: left; line-height: 1.6; }
        
        .ios-button { display: block; width: 100%; background-color: #3b82f6; color: white !important; padding: 12px 0; border-radius: 12px; font-weight: 600; text-align: center; text-decoration: none; margin-top: 1.5rem; transition: opacity 0.2s; }
        .filter-btn { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; transition: all 0.2s; border: 1px solid #e5e7eb; background: transparent; }
        .dark .filter-btn { border-color: #374151; }
        .filter-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }

        /* Chatbot Styles */
        #chatbot-window { transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; transform: translateY(20px); opacity: 0; pointer-events: none; }
        #chatbot-window.show { transform: translateY(0); opacity: 1; pointer-events: all; }
        .chat-message { max-width: 85%; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .chat-user { background-color: #3b82f6; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .chat-ai { background-color: #f3f4f6; color: #1f2937; margin-right: auto; border-bottom-left-radius: 2px; }
        .dark .chat-ai { background-color: #374151; color: #e5e7eb; }
        /* Scrollbar für Chat */
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark #chat-history::-webkit-scrollbar-thumb { background-color: #4b5563; }
        
        /* Hover-Effekt für die klickbare Urteilsnummer */
        .urteil-link:hover { text-decoration: underline; opacity: 0.8; }
    </style>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white font-sans antialiased text-left relative">
    <div class="max-w-4xl mx-auto min-h-screen px-4 py-8 pb-24">
        <header class="flex justify-between items-center mb-8 border-b border-gray-100 dark:border-gray-800 pb-4 relative">
            <div class="relative">
                <button onclick="toggleMenu(event, 'theme-menu')" id="theme-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span id="active-theme-icon" class="font-bold"></span>
                </button>
                <div id="theme-menu" class="dropdown-menu left-0 mt-2 w-48 bg-white dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl overflow-hidden">
                    <button onclick="setTheme('system')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm border-b border-gray-100 dark:border-gray-800">System</button>
                    <button onclick="setTheme('light')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm border-b border-gray-100 dark:border-gray-800">Hell</button>
                    <button onclick="setTheme('dark')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">Dunkel</button>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="setFilter('iv')" id="filter-iv" class="filter-btn">IV</button>
                <button onclick="setFilter('ak')" id="filter-ak" class="filter-btn">AK</button>
                <button onclick="setFilter('alle')" id="filter-alle" class="filter-btn">Alle</button>
            </div>

            <div class="flex gap-1 relative">
                <div class="relative">
                    <button onclick="toggleMenu(event, 'view-menu')" id="view-btn" class="text-gray-600 dark:text-gray-300 p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>
                    </button>
                    <div id="view-menu" class="dropdown-menu right-0 mt-2 w-48 bg-white dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-xl overflow-hidden">
                        <button onclick="setView('newest')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm border-b border-gray-100 dark:border-gray-800">Nur aktuellster Tag</button>
                        <button onclick="setView('all')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm border-b border-gray-100 dark:border-gray-800">Alle aufklappen</button>
                        <button onclick="setView('none')" class="w-full px-4 py-3 text-left hover:bg-gray-100 dark:hover:bg-gray-800 text-sm">Alle zuklappen</button>
                    </div>
                </div>
                <button onclick="location.reload()" class="text-gray-400 p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors" title="Seite neu laden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </header>

        <h1 id="page-title" class="text-3xl font-bold mb-8 text-left tracking-tight">IV- und AK-relevante Urteile</h1>
        <div id="loading" class="text-gray-500 text-center py-10 italic">Lade Entscheide...</div>
        <div id="app-container" class="space-y-6"></div>
    </div>

    <button onclick="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-105 z-50">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
    </button>

    <div id="chatbot-window" class="fixed bottom-24 right-6 w-80 sm:w-96 bg-white dark:bg-[#1c1c1e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl flex flex-col z-50 overflow-hidden" style="height: 550px; max-height: 75vh;">
        <div class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span class="font-bold text-sm">Urteils-Assistent (KI)</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearChat()" class="text-blue-100 hover:text-white transition-colors" title="Chatverlauf löschen">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>
                <button onclick="toggleChat()" class="text-blue-100 hover:text-white transition-colors" title="Chatfenster schliessen">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
        
        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 shadow-sm z-10">
            <label class="block text-[11px] font-bold text-gray-500 dark:text-gray-400 mb-1 uppercase tracking-wider">Urteilsnummer eingeben</label>
            <input type="text" id="chat-urteil-id" placeholder="z.B. 9C_9/2025" class="w-full bg-white dark:bg-black border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm font-medium text-blue-600 dark:text-blue-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
        </div>

        <div id="chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-white dark:bg-[#1c1c1e]">
            <div class="chat-message chat-ai">
                Hallo! Gib oben eine Urteilsnummer ein und stelle mir eine spezifische Frage zu diesem Entscheid.
            </div>
        </div>

        <div class="p-3 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-[#1c1c1e] z-10">
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Stelle eine Frage..." class="flex-1 bg-gray-100 dark:bg-gray-800 border-transparent rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white dark:focus:bg-black transition-all" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl w-10 flex flex-shrink-0 items-center justify-center transition-colors">
                    <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V6m0 0l-7 7m7-7l7 7"/></svg>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // --- HAUPT-LOGIK DER WEBSEITE (FILTER, THEME, JSON) ---
        let allData = [];
        const urlParams = new URLSearchParams(window.location.search);
        const urlFilter = urlParams.get('filter');
        let currentFilter = (urlFilter && ['iv', 'ak', 'alle'].includes(urlFilter)) ? urlFilter : (localStorage.getItem('filter') || 'alle');

        const icons = {
            dark: '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.38 5.38 0 01-4.4 2.26 5.4 5.4 0 01-5.4-5.4c0-1.31.48-2.51 1.27-3.44A9.03 9.03 0 0012 3z"/></svg>',
            light: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            system: '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" /><path d="M12 3v1m0 16v1m9-9h-1M4 12H3" opacity="0.5"/></svg>'
        };

        function applyTheme(theme) {
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
            document.getElementById('active-theme-icon').innerHTML = icons[theme] || icons.system;
        }
        function setTheme(t) { localStorage.theme = t; applyTheme(t); document.getElementById('theme-menu').classList.remove('show'); }
        function toggleMenu(e, id) { e.stopPropagation(); document.querySelectorAll('.dropdown-menu').forEach(m => { if(m.id !== id) m.classList.remove('show'); }); document.getElementById(id).classList.toggle('show'); }
        window.onclick = () => document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        applyTheme(localStorage.theme || 'system');

        function setFilter(mode) {
            currentFilter = mode;
            localStorage.setItem('filter', mode);
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('filter', mode);
            window.history.pushState({}, '', newUrl);
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('filter-' + mode).classList.add('active');
            document.getElementById('page-title').innerText = mode === 'iv' ? "IV-relevante Urteile" : mode === 'ak' ? "AK-relevante Urteile" : "IV- und AK-relevante Urteile";
            renderUrteile();
        }

        function setView(mode) {
            const groups = document.querySelectorAll('.accordion-group');
            groups.forEach((group, index) => {
                if (mode === 'newest') index === 0 ? group.classList.add('is-open') : group.classList.remove('is-open');
                else if (mode === 'all') group.classList.add('is-open');
                else if (mode === 'none') group.classList.remove('is-open');
            });
        }

        function formatSummary(text) {
            if (!text) return '';
            let html = '<span class="summary-text-block">' + text.trim() + '</span>';
            html = html.replace(/\*\*(.*?)\*\*\n?/g, '</span><span class="summary-title">$1</span><span class="summary-text-block">');
            html = html.replace(/<u>(.*?)<\/u>\s*:?\s*/g, function(match, innerText) {
                let cleanText = innerText.replace(/:$/, '').trim();
                return '</span><div class="mb-2 mt-4 font-medium"><u>' + cleanText + '</u>:</div><span class="summary-text-block">';
            });
            html = html.replace(/\n\n/g, '</span><span class="summary-text-block">');
            html = html.replace(/<span class="summary-text-block">\s*<\/span>/g, '');
            return html;
        }

        async function loadUrteile() {
            try {
                const response = await fetch('urteile.json?v=' + Date.now());
                allData = await response.json();
                document.getElementById('loading').style.display = 'none';
                setFilter(currentFilter); 
            } catch (e) { document.getElementById('loading').innerHTML = "Fehler beim Laden."; }
        }

        function renderUrteile() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            const tageMap = {};
            allData.forEach(u => { if (!tageMap[u.datum]) tageMap[u.datum] = []; tageMap[u.datum].push(u); });

            Object.keys(tageMap).sort((a, b) => b.split('.').reverse().join('') - a.split('.').reverse().join('')).forEach((datum, i) => {
                const tagUrteile = tageMap[datum];
                const hatEchteIV = tagUrteile.some(u => u.kategorie === 'iv' && !u.aktenzeichen.startsWith('INFO_SKIP'));
                const hatEchteAK = tagUrteile.some(u => u.kategorie === 'ak' && !u.aktenzeichen.startsWith('INFO_SKIP'));

                let anzuzeigendeUrteile = [];
                if (currentFilter === 'alle') {
                    anzuzeigendeUrteile = (!hatEchteIV && !hatEchteAK) ? tagUrteile.filter(u => u.aktenzeichen === 'INFO_SKIP_BEIDE') : tagUrteile.filter(u => !u.aktenzeichen.startsWith('INFO_SKIP'));
                } else if (currentFilter === 'iv') {
                    anzuzeigendeUrteile = hatEchteIV ? tagUrteile.filter(u => u.kategorie === 'iv' && !u.aktenzeichen.startsWith('INFO_SKIP')) : [{vorschau: "Keine neuen IV-relevanten Urteile", aktenzeichen: 'INFO_SKIP_IV'}];
                } else if (currentFilter === 'ak') {
                    anzuzeigendeUrteile = hatEchteAK ? tagUrteile.filter(u => u.kategorie === 'ak' && !u.aktenzeichen.startsWith('INFO_SKIP')) : [{vorschau: "Keine neuen AK-relevanten Urteile", aktenzeichen: 'INFO_SKIP_AK'}];
                }

                if (anzuzeigendeUrteile.length === 0) return;

                const daySection = document.createElement('div');
                daySection.className = i === 0 ? "accordion-group is-open" : "accordion-group";
                let dayHtml = `<button onclick="this.parentElement.classList.toggle('is-open')" class="w-full flex justify-between items-center mb-2"><span class="text-xl font-bold">${datum}</span><svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="accordion-content space-y-3">`;
                dayHtml += `<div class="bg-gray-100 dark:bg-[#1c1c1e] rounded-2xl overflow-hidden divide-y divide-gray-200 dark:divide-gray-800 shadow-sm">`;
                
                anzuzeigendeUrteile.forEach(u => {
                    if (u.aktenzeichen.startsWith('INFO_SKIP')) {
                        dayHtml += `<div class="p-6 text-gray-500 italic text-center">${u.vorschau}</div>`;
                    } else {
                        const tagLabel = u.kategorie.toUpperCase();
                        let rolle = '';
                        if (u.iv_zh_fuehrer) rolle += `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Beschwerdeführerin: IV-Stelle Zürich</div>`;
                        if (u.iv_zh_gegner)  rolle += `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Beschwerdegegnerin: IV-Stelle Zürich</div>`;
                        if (u.ak_zh_fuehrer) rolle += `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Beschwerdeführerin: Sozialversicherungsanstalt Zürich</div>`;
                        if (u.ak_zh_gegner)  rolle += `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Beschwerdegegnerin: Sozialversicherungsanstalt Zürich</div>`;
                        const pubHinweis = u.publikation ? `<div class="text-red-600 dark:text-red-500 font-bold text-sm mt-1">Achtung: Zur Publikation vorgesehen!</div>` : '';
                        
                        // NEU: onclick Event direkt in den Span der Urteilsnummer eingebaut
                        dayHtml += `
                            <div class="sub-accordion-item">
                                <button onclick="this.parentElement.classList.toggle('is-open')" class="w-full text-left px-6 py-5 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors flex justify-between items-center group relative">
                                    <div>
                                        <div class="flex items-center">
                                            <span class="text-blue-600 dark:text-blue-500 font-bold text-xl cursor-pointer urteil-link relative z-10" title="Im Chatbot öffnen" onclick="openChatForUrteil(event, '${u.aktenzeichen}')">${u.aktenzeichen}</span>
                                            <span class="ml-2 px-2 py-0.5 bg-gray-200 dark:bg-gray-800 text-[10px] rounded font-bold">${tagLabel}</span>
                                        </div>
                                        ${rolle}${pubHinweis}
                                        <div class="text-gray-500 text-sm mt-0.5 relative z-0">${u.vorschau}</div>
                                    </div>
                                    <svg class="rotate-icon w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <div class="accordion-content bg-white/40 dark:bg-black/20">
                                    <div class="px-6 pt-3 pb-6 text-base border-t border-gray-200 dark:border-gray-800/30 text-left">
                                        ${formatSummary(u.zusammenfassung)}
                                        <a href="${u.url}" target="_blank" class="ios-button">Originalurteil öffnen</a>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
                dayHtml += `</div></div>`;
                daySection.innerHTML = dayHtml;
                container.appendChild(daySection);
            });
        }
        
        // Initialer Ladeaufruf
        loadUrteile();

        // --- KI CHATBOT LOGIK ---
        
        // Chatfenster öffnen/schliessen
        function toggleChat() {
            document.getElementById('chatbot-window').classList.toggle('show');
            document.getElementById('chat-input').focus();
        }

        // NEU: Chat leeren
        function clearChat() {
            const history = document.getElementById('chat-history');
            history.innerHTML = `
                <div class="chat-message chat-ai">
                    Hallo! Gib oben eine Urteilsnummer ein und stelle mir eine spezifische Frage zu diesem Entscheid.
                </div>
            `;
            document.getElementById('chat-input').value = '';
        }

        // NEU: Urteil in Chat übernehmen und öffnen
        function openChatForUrteil(event, urteilId) {
            // Verhindert, dass sich das Accordion beim Klick auf die Nummer ungewollt öffnet/schliesst
            event.stopPropagation(); 
            
            // Nummer in das Chat-Textfeld eintragen
            document.getElementById('chat-urteil-id').value = urteilId;
            
            // Wenn der Chatbot noch zu ist, öffnen
            const chatWindow = document.getElementById('chatbot-window');
            if (!chatWindow.classList.contains('show')) {
                toggleChat();
            } else {
                // Falls er schon offen ist, zumindest den Fokus aufs Eingabefeld setzen
                document.getElementById('chat-input').focus();
            }
        }

        function addMessageToChat(text, sender, id = null) {
            const history = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            if (id) msgDiv.id = id;
            msgDiv.className = `chat-message ${sender === 'user' ? 'chat-user' : 'chat-ai'}`;
            msgDiv.innerText = text;
            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        async function sendChatMessage() {
            const inputField = document.getElementById('chat-input');
            const urteilField = document.getElementById('chat-urteil-id');
            const question = inputField.value.trim();
            const urteilId = urteilField.value.trim();

            if (!question) return;
            if (!urteilId) {
                alert("Bitte gib oben die gewünschte Urteilsnummer ein (z.B. 9C_9/2025) oder klicke auf eine Nummer in der Liste.");
                urteilField.focus();
                return;
            }

            // 1. User Message anzeigen und Input leeren
            addMessageToChat(question, 'user');
            inputField.value = '';
            
            // 2. Loading State anzeigen
            const loadingId = 'loading-' + Date.now();
            addMessageToChat("Analysiere Urteil...", 'ai', loadingId);
            const loadingElement = document.getElementById(loadingId);
            loadingElement.classList.add("italic", "text-gray-500", "dark:text-gray-400");

            try {
                // 3. Den Volltext des Urteils von GitHub laden (RAG-Prinzip)
                const safeFilename = urteilId.replace(/\//g, '_'); 
                const textResponse = await fetch(`urteilstexte/${safeFilename}.txt`);
                
                if (!textResponse.ok) {
                    loadingElement.innerText = `Ich konnte das Urteil "${urteilId}" in der Datenbank nicht finden. Ist das Urteil bereits gescrapt worden?`;
                    loadingElement.classList.remove("italic", "text-gray-500", "dark:text-gray-400");
                    return;
                }
                const urteilText = await textResponse.text();

                // 4. Text und Frage an den sicheren Render-Proxy senden
                const renderUrl = "https://bger-chatbot.onrender.com/ask"; 

                const apiResponse = await fetch(renderUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        urteil_text: urteilText,
                        frage: question
                    })
                });

                const data = await apiResponse.json();

                // 5. Antwort anzeigen
                loadingElement.classList.remove("italic", "text-gray-500", "dark:text-gray-400");
                if (apiResponse.ok) {
                    loadingElement.innerText = data.antwort;
                } else {
                    loadingElement.innerText = `Fehler: ${data.detail || data.error || 'Unbekannter Serverfehler'}`;
                }

            } catch (error) {
                loadingElement.classList.remove("italic", "text-gray-500", "dark:text-gray-400");
                loadingElement.innerText = "Verbindungsfehler zum KI-Server. Möglicherweise wacht der Server gerade auf, bitte versuche es in 30 Sekunden noch einmal.";
            }
        }
    </script>
</body>
</html>
